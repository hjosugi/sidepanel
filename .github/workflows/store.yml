name: Chrome Web Store

# Uploads the release zip to the existing store item and submits it for review.
# Needs repository secrets CWS_CLIENT_ID / CWS_CLIENT_SECRET / CWS_REFRESH_TOKEN and
# variables CWS_PUBLISHER_ID / CWS_EXTENSION_ID. See store/README.md.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.2.0'
        required: true
      upload-only:
        description: 'Upload without submitting for review'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run zip
      - name: Upload and submit
        run: node tools/cws-publish.mjs dist/sidepanel-bookmarks-*.zip ${{ inputs.upload-only && '--upload-only' || '' }}
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
