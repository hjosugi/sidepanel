name: Site compatibility

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 'Check sites with Sec-Fetch-Dest: iframe'
        run: node tools/compat-check.mjs >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
