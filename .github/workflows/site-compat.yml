name: Site compatibility

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: "Check sites with Sec-Fetch-Dest: iframe"
        run: npm run compat >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
