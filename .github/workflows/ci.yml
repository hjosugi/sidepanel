name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      # Branded Google Chrome ignores --load-extension since 137, so use Chrome for Testing.
      - name: Install Chrome for Testing
        id: chrome
        run: |
          bin="$(npx --yes @puppeteer/browsers@3.2.7 install chrome@stable --path "$RUNNER_TEMP/browsers" | tail -1 | cut -d' ' -f2-)"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: Build and unpack the release zip
        run: |
          npm run zip
          unzip -q dist/*.zip -d "$RUNNER_TEMP/extension"
      - name: Smoke test the packaged extension (headless Chrome for Testing)
        run: npm test
        env:
          BROWSER_BIN: ${{ steps.chrome.outputs.bin }}
          EXTENSION_DIR: ${{ runner.temp }}/extension
