name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      # Branded Google Chrome ignores --load-extension since 137, so use Chrome for Testing.
      - name: Install Chrome for Testing
        id: chrome
        run: |
          bin="$(npx --yes @puppeteer/browsers@3.2.7 install chrome@stable --path "$RUNNER_TEMP/browsers" | tail -1 | cut -d' ' -f2-)"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Release package smoke
        run: |
          npm run release:package
          unzip -q .release/*.zip -d "$RUNNER_TEMP/extension"

      - name: Smoke test the packaged extension
        run: npm test
        env:
          BROWSER_BIN: ${{ steps.chrome.outputs.bin }}
          EXTENSION_DIR: ${{ runner.temp }}/extension
